<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gograph — Visualizador de Grafo Go</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500/30">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const KIND_COLORS = {
      static: "#38bdf8",
      interface: "#a78bfa",
      go: "#34d399",
      defer: "#fbbf24",
      closure: "#f472b6",
      dynamic: "#fb7185",
    };

    function shortFuncName(fullName, pkg) {
      if (pkg && fullName.startsWith(pkg + ".")) {
        return fullName.slice(pkg.length + 1);
      }
      const idx = fullName.lastIndexOf("/");
      return idx >= 0 ? fullName.slice(idx + 1) : fullName;
    }

    function GraphCanvas({ graph, selectedId, onSelect }) {
      const nodeMap = useMemo(() => {
        const m = new Map();
        if (graph) graph.nodes.forEach((n) => m.set(n.id, n));
        return m;
      }, [graph]);

      const { center, callers, callees } = useMemo(() => {
        if (!graph || !selectedId) return { center: null, callers: [], callees: [] };
        const center = nodeMap.get(selectedId);
        if (!center) return { center: null, callers: [], callees: [] };
        const callers = [];
        const callees = [];
        const seenIn = new Set();
        const seenOut = new Set();
        for (const e of graph.edges) {
          if (e.callee === selectedId && !seenIn.has(e.caller)) {
            const n = nodeMap.get(e.caller);
            if (n) { callers.push({ node: n, kind: e.kind }); seenIn.add(e.caller); }
          }
          if (e.caller === selectedId && !seenOut.has(e.callee)) {
            const n = nodeMap.get(e.callee);
            if (n) { callees.push({ node: n, kind: e.kind }); seenOut.add(e.callee); }
          }
        }
        return { center, callers: callers.slice(0, 18), callees: callees.slice(0, 18) };
      }, [graph, selectedId, nodeMap]);

      if (!center) {
        return (
          <div className="flex h-full items-center justify-center text-slate-500 text-sm">
            Selecione uma função na barra lateral para visualizar o grafo de chamadas.
          </div>
        );
      }

      const width = 900;
      const maxRows = Math.max(callers.length, callees.length, 1);
      const height = Math.max(520, maxRows * 48 + 80);
      const cx = width / 2;
      const cy = height / 2;

      const placeColumn = (items, x) => {
        const step = height / (items.length + 1);
        return items.map((item, i) => ({
          ...item,
          x,
          y: step * (i + 1),
        }));
      };

      const leftNodes = placeColumn(callers, 165);
      const rightNodes = placeColumn(callees, width - 165);

      return (
        <div className="h-full w-full overflow-auto bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:20px_20px] p-4">
          <div className="mb-2 flex flex-wrap items-center gap-3 text-xs text-slate-400">
            <span className="font-semibold text-slate-300">Arestas:</span>
            {Object.entries(KIND_COLORS).map(([k, col]) => (
              <span key={k} className="inline-flex items-center gap-1.5">
                <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: col }} />
                {k}
              </span>
            ))}
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full min-w-[700px]">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
              </marker>
            </defs>

            {leftNodes.map((it) => {
              const col = KIND_COLORS[it.kind] || "#64748b";
              return (
                <path
                  key={"in-" + it.node.id}
                  d={`M ${it.x + 115} ${it.y} C ${(it.x + cx) / 2} ${it.y}, ${(it.x + cx) / 2} ${cy}, ${cx - 125} ${cy}`}
                  fill="none"
                  stroke={col}
                  strokeWidth="1.75"
                  strokeOpacity="0.75"
                  markerEnd="url(#arrow)"
                />
              );
            })}

            {rightNodes.map((it) => {
              const col = KIND_COLORS[it.kind] || "#64748b";
              return (
                <path
                  key={"out-" + it.node.id}
                  d={`M ${cx + 125} ${cy} C ${(cx + it.x) / 2} ${cy}, ${(cx + it.x) / 2} ${it.y}, ${it.x - 115} ${it.y}`}
                  fill="none"
                  stroke={col}
                  strokeWidth="1.75"
                  strokeOpacity="0.75"
                  markerEnd="url(#arrow)"
                />
              );
            })}

            {leftNodes.map((it) => (
              <g key={"ln-" + it.node.id} onClick={() => onSelect(it.node.id)} className="cursor-pointer group">
                <rect x={it.x - 115} y={it.y - 16} width="230" height="32" rx="8" fill="#0f172a" stroke="#334155" strokeWidth="1.2" className="group-hover:stroke-sky-400" />
                <text x={it.x} y={it.y + 4} textAnchor="middle" fill="#e2e8f0" fontSize="11" fontFamily="monospace">
                  {shortFuncName(it.node.name, it.node.package).slice(0, 30)}
                </text>
              </g>
            ))}

            {rightNodes.map((it) => (
              <g key={"rn-" + it.node.id} onClick={() => onSelect(it.node.id)} className="cursor-pointer group">
                <rect
                  x={it.x - 115} y={it.y - 16} width="230" height="32" rx="8"
                  fill={it.node.external ? "#1e1b4b" : "#0f172a"}
                  stroke={it.node.external ? "#4338ca" : "#334155"}
                  strokeWidth="1.2"
                  className="group-hover:stroke-sky-400"
                />
                <text x={it.x} y={it.y + 4} textAnchor="middle" fill={it.node.external ? "#c7d2fe" : "#e2e8f0"} fontSize="11" fontFamily="monospace">
                  {shortFuncName(it.node.name, it.node.package).slice(0, 30)}
                </text>
              </g>
            ))}

            <g>
              <rect x={cx - 125} y={cy - 24} width="250" height="48" rx="12" fill="#0284c7" stroke="#38bdf8" strokeWidth="2" />
              <text x={cx} y={cy - 2} textAnchor="middle" fill="#ffffff" fontSize="12" fontWeight="bold" fontFamily="monospace">
                {shortFuncName(center.name, center.package).slice(0, 30)}
              </text>
              <text x={cx} y={cy + 14} textAnchor="middle" fill="#e0f2fe" fontSize="10" fontFamily="sans-serif">
                {center.package}
              </text>
            </g>
          </svg>
        </div>
      );
    }

    function App() {
      const [graph, setGraph] = useState(null);
      const [query, setQuery] = useState("");
      const [pkgFilter, setPkgFilter] = useState("ALL");
      const [showExternal, setShowExternal] = useState(false);
      const [selectedId, setSelectedId] = useState(null);
      const [detail, setDetail] = useState(null);
      const [loading, setLoading] = useState(true);

      const loadGraph = () => {
        fetch("/api/graph")
          .then((r) => r.json())
          .then((data) => {
            setGraph(data);
            setLoading(false);
            if (!selectedId && data.nodes.length > 0) {
              const firstInternal = data.nodes.find((n) => !n.external) || data.nodes[0];
              setSelectedId(firstInternal.id);
            }
          });
      };

      useEffect(() => { loadGraph(); }, []);

      useEffect(() => {
        if (!selectedId) return;
        fetch(`/api/source?id=${selectedId}`)
          .then((r) => r.json())
          .then(setDetail);
      }, [selectedId]);

      const packages = useMemo(() => {
        if (!graph) return [];
        const s = new Set();
        graph.nodes.forEach((n) => {
          if (showExternal || !n.external) s.add(n.package);
        });
        return Array.from(s).sort();
      }, [graph, showExternal]);

      const filteredNodes = useMemo(() => {
        if (!graph) return [];
        const q = query.trim().toLowerCase();
        return graph.nodes.filter((n) => {
          if (!showExternal && n.external) return false;
          if (pkgFilter !== "ALL" && n.package !== pkgFilter) return false;
          if (!q) return true;
          return n.name.toLowerCase().includes(q) || (n.file && n.file.toLowerCase().includes(q));
        });
      }, [graph, query, pkgFilter, showExternal]);

      if (loading) {
        return <div className="flex h-screen items-center justify-center text-slate-400">Carregando grafo...</div>;
      }

      return (
        <div className="flex h-screen flex-col overflow-hidden">
          <header className="flex items-center justify-between border-b border-slate-800 bg-slate-900/90 px-4 py-2.5">
            <div className="flex items-center gap-3">
              <span className="rounded-lg bg-sky-500/15 px-2.5 py-1 font-mono text-sm font-bold text-sky-400">gograph</span>
              <span className="text-sm text-slate-300 font-medium">{graph?.module || "projeto"}</span>
              <span className="text-xs text-slate-500">
                {graph?.nodes.filter((n) => !n.external).length} funções · {graph?.edges.length} arestas
              </span>
            </div>
            <button
              onClick={loadGraph}
              className="rounded-md border border-slate-700 bg-slate-800 px-3 py-1 text-xs font-medium text-slate-200 hover:bg-slate-700"
            >
              Recarregar grafo
            </button>
          </header>

          <div className="grid flex-1 grid-cols-12 overflow-hidden">
            {/* Sidebar */}
            <aside className="col-span-3 flex flex-col border-r border-slate-800 bg-slate-900/50 overflow-hidden">
              <div className="space-y-2 border-b border-slate-800 p-3">
                <input
                  type="text"
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="Buscar função ou arquivo..."
                  className="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm text-slate-100 placeholder-slate-500 focus:border-sky-500 focus:outline-none"
                />
                <select
                  value={pkgFilter}
                  onChange={(e) => setPkgFilter(e.target.value)}
                  className="w-full rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-xs text-slate-200 focus:border-sky-500 focus:outline-none"
                >
                  <option value="ALL">Todos os pacotes ({packages.length})</option>
                  {packages.map((p) => (
                    <option key={p} value={p}>{p}</option>
                  ))}
                </select>
                <label className="flex items-center gap-2 text-xs text-slate-400 cursor-pointer">
                  <input type="checkbox" checked={showExternal} onChange={(e) => setShowExternal(e.target.checked)} className="rounded border-slate-700 bg-slate-950" />
                  Mostrar símbolos externos (stdlib / terceiros)
                </label>
              </div>
              <div className="flex-1 overflow-y-auto divide-y divide-slate-800/60">
                {filteredNodes.slice(0, 400).map((n) => (
                  <button
                    key={n.id}
                    onClick={() => setSelectedId(n.id)}
                    className={`w-full px-3 py-2 text-left transition hover:bg-slate-800/60 ${selectedId === n.id ? "bg-sky-500/15 border-l-2 border-sky-400" : ""}`}
                  >
                    <div className="truncate font-mono text-xs font-medium text-slate-100">
                      {shortFuncName(n.name, n.package)}
                    </div>
                    <div className="truncate text-[11px] text-slate-500">
                      {n.file ? `${n.file}:${n.lineStart}` : n.package}
                    </div>
                  </button>
                ))}
              </div>
            </aside>

            {/* Grafo */}
            <main className="col-span-5 border-r border-slate-800 overflow-hidden">
              <GraphCanvas graph={graph} selectedId={selectedId} onSelect={setSelectedId} />
            </main>

            {/* Código e detalhes */}
            <section className="col-span-4 flex flex-col bg-slate-950 overflow-hidden">
              {detail ? (
                <div className="flex h-full flex-col overflow-hidden">
                  <div className="border-b border-slate-800 p-4 space-y-2">
                    <div className="font-mono text-sm font-bold text-sky-400 break-all">{detail.name}</div>
                    {detail.file && (
                      <div className="text-xs text-slate-400">
                        {detail.file} (linhas {detail.lineStart}–{detail.lineEnd})
                      </div>
                    )}
                    {detail.signature && (
                      <pre className="overflow-x-auto rounded-md bg-slate-900 p-2 font-mono text-xs text-emerald-300 border border-slate-800">
                        {detail.signature}
                      </pre>
                    )}
                    {detail.description && (
                      <div className="rounded-md bg-slate-900/70 p-2 text-xs text-slate-300 border border-slate-800">
                        {detail.description}
                      </div>
                    )}
                  </div>

                  <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    {detail.code ? (
                      <div>
                        <h3 className="mb-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">Código-fonte</h3>
                        <pre className="overflow-x-auto rounded-lg border border-slate-800 bg-slate-900 p-3 font-mono text-xs leading-relaxed text-slate-100">
                          {detail.code}
                        </pre>
                      </div>
                    ) : (
                      <div className="rounded-md border border-slate-800 bg-slate-900/40 p-3 text-xs text-slate-500">
                        Função externa ao módulo (sem código-fonte local).
                      </div>
                    )}

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <h4 className="mb-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                          Chamada por ({detail.calledBy?.length || 0})
                        </h4>
                        <div className="space-y-1">
                          {(detail.calledBy || []).map((c, idx) => (
                            <button
                              key={idx}
                              onClick={() => setSelectedId(c.id)}
                              className="w-full truncate rounded border border-slate-800 bg-slate-900/60 px-2 py-1 text-left font-mono text-[11px] text-slate-300 hover:border-sky-500"
                              title={c.name}
                            >
                              <span className="mr-1 text-[10px] text-slate-500">[{c.kind}]</span>
                              {shortFuncName(c.name, c.package)}
                            </button>
                          ))}
                        </div>
                      </div>
                      <div>
                        <h4 className="mb-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                          Chama ({detail.calls?.length || 0})
                        </h4>
                        <div className="space-y-1">
                          {(detail.calls || []).map((c, idx) => (
                            <button
                              key={idx}
                              onClick={() => setSelectedId(c.id)}
                              className="w-full truncate rounded border border-slate-800 bg-slate-900/60 px-2 py-1 text-left font-mono text-[11px] text-slate-300 hover:border-sky-500"
                              title={c.name}
                            >
                              <span className="mr-1 text-[10px] text-slate-500">[{c.kind}]</span>
                              {shortFuncName(c.name, c.package)}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="flex h-full items-center justify-center text-sm text-slate-500">
                  Selecione uma função para ver o código.
                </div>
              )}
            </section>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
